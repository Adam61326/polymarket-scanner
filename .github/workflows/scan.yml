name: Polymarket Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - run: python polymarket_opportunities.py --once --ntfy-topic "${{ secrets.NTFY_TOPIC }}"

      - name: Sauvegarder l'etat entre les passages
        run: |
          git config user.name "polymarket-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_trades.json seen_markets.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "update state"
          git push
